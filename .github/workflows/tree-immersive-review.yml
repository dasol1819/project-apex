name: Aircraft tree UI review
on:
  push:
    branches: [feature-tree-immersive-20261108]
  pull_request:
    paths:
      - 'web/aircraft-tree*'
      - 'web/index.html'
      - 'web/app.js'
      - 'web/manifest.json'
      - 'tests/tree-immersive-browser.py'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Restore and inspect original CSS selectors
        run: |
          python3 .deployment/restore.py
          python3 - <<'PY'
          from pathlib import Path
          for file in ['aircraft-tree.css','aircraft-tree-map.css','style.css']:
            p=Path('public')/file
            print('===== ORIGINAL CSS',file,'SIZE',p.stat().st_size,'=====')
            if file!='style.css':
              for n,l in enumerate(p.read_text().splitlines(),1):
                if file=='aircraft-tree.css' or '.aircraft-tree' in l or '.tree-' in l:
                  print(f'{n}: {l}'[:380])
          PY
          python3 - <<'PY'
          from pathlib import Path
          for f,numbers in [('aircraft-tree.css',[4,5,7,8,10,11,13,15,16]),('aircraft-tree-map.css',[2,4]),('style.css',[])]:
            for n,line in enumerate((Path('public')/f).read_text().splitlines(),1):
              if n in numbers or (f=='style.css' and any(k in line for k in ['#welcome{','[data-menu-stage="tree"]','#aircraft-tree-screen'])):
                print('DETAIL',f,n,'LEN',len(line))
                for pos in range(0,len(line),1100):print('CSS',f,n,pos,line[pos:pos+1100])
          PY
