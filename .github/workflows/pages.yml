name: Deploy Project Apex
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore and verify game files
        run: python3 .deployment/restore.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Rebuild the native Russian aircraft combat module
        run: |
          npm ci
          node scripts/native/export-mig15-shapes.mjs public
          git diff --exit-code -- assets/mig15bis/shapes.json
          npm run build:combat
          # The expanded 17th-aircraft WASM is reproducibly generated by CI.
          # Publish the built output; don't require binary uploads via the text-only connector.
          cp web/flight.wasm public/flight.wasm
          node tests/mig23-native.mjs
          node tests/mig23-autosweep.mjs
          node tests/pilot-instructor.mjs
      - name: Check native combat and legacy flight regression
        run: |
          node tests/su35-combat-native.mjs public
          node tests/su35-combat-systems.mjs public
          node tests/missile-systems.mjs public
      - name: Check Su-35 exterior and existing aircraft
        run: node tests/su35-geometry.mjs public
      - name: Check Su-35 combat geometry, stations and wreckage
        run: node tests/su35-combat-model.mjs public
      - name: Check Su-35 flight forces and integration
        run: node tests/su35-flight-physics.mjs public
      - name: Check MiG-29 flight, combat and model
        run: |
          node tests/mig29-native.mjs public
          node tests/mig29-combat.mjs public
          node tests/mig29-model.mjs public
          node tests/mig29-surface-data.mjs public
      - name: Check MiG-15bis flight, mixed cannon fit and exterior
        run: |
          node tests/mig15-native.mjs public
          node tests/mig15-model.mjs public
          node tests/mig15-hinges.mjs public
          node scripts/aircraft-progress.mjs
      - name: Check MiG-23MLD glTF airframe preview
        run: node tests/mig23mld-preview.mjs public
      - name: Check MiG-23MLD PBR maps and source geometry
        run: node tests/mig23mld-pbr.mjs public
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
