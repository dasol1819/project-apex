name: MiG23 native dispatch probe
on:
  push:
    branches: [feature-mig23mld-native-flight-20261108]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: node scripts/native/probe-mig23.mjs
