name: MiG23 native flight build
on:
  pull_request:
    paths:
      - 'scripts/native/build-mig23.mjs'
      - 'scripts/native/patch-instructor.mjs'
      - 'web/app.js'
      - 'web/aim-input.js'
      - 'web/maneuver-stick.js'
      - '.github/workflows/mig23-native-flight.yml'
      - 'scripts/fit-mig23-airbrakes.cpp'
      - 'scripts/fit-mig23-tail-bounds.cpp'
      - 'docs/aircraft-review/mig23mld/tail-damage-vertices.csv'
      - 'web/damage-effects.js'
      - 'web/part-emitter.js'
      - 'web/wreckage-mesh.js'
      - 'tests/wreckage-morph.mjs'
      - 'tests/mig23-nozzle-browser.py'
      - 'tests/mig23-async-wreckage-browser.py'
      - 'scripts/fit-mig23-nozzle-bounds.cpp'
      - 'docs/aircraft-review/mig23mld/nozzle-damage-vertices.csv'
      - 'tests/part-emitter-scale.mjs'
      - 'docs/aircraft-review/mig23mld/airbrake-*'
      - 'scripts/native/patch-missiles.mjs'
      - 'web/missile-data.js'
      - 'tests/missile-systems.mjs'
      - 'tests/missile-browser.py'
      - 'assets/mig23mld/**'
      - 'tests/mig23-native.mjs'
      - 'tests/mig23-tail-combat.mjs'
      - 'tests/mig23-nozzle-native.mjs'
      - 'tests/mig23-nozzle-combat.mjs'
      - 'tests/mig23-browser.py'
      - 'tests/mig23-resource-browser.py'
      - 'tests/mig23-damage-browser.py'
      - 'web/mig23mld-game.js'
      - 'web/mig23mld-flight.js'
      - 'tests/mig23-autosweep.mjs'
concurrency:
  group: mig23-flight-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Rebuild authored airbrake registration
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic scripts/fit-mig23-airbrakes.cpp -o /tmp/fit-airbrakes
          /tmp/fit-airbrakes docs/aircraft-review/mig23mld/airbrake-landmarks.csv > /tmp/airbrake-fit.json
          python3 - <<'PY'
          import json, math
          actual=json.load(open('/tmp/airbrake-fit.json'))
          recorded=json.load(open('docs/aircraft-review/mig23mld/airbrake-fit.json'))
          assert actual.keys()==recorded.keys()
          for name, fit in actual.items():
              assert fit['rmsMetres']<0.00001 and fit['pairs']>=7
              for key, value in fit.items():
                  expected=recorded[name][key]
                  if isinstance(value,list):
                      assert all(math.isclose(a,b,abs_tol=1e-10) for a,b in zip(value,expected))
                  else:
                      assert math.isclose(value,expected,abs_tol=1e-10)
          PY
      - name: Rebuild source tail collision envelopes
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror scripts/fit-mig23-tail-bounds.cpp -o /tmp/fit-mig23-tail-bounds
          /tmp/fit-mig23-tail-bounds docs/aircraft-review/mig23mld/tail-damage-vertices.csv > /tmp/tail-damage-shapes.json
          python3 - <<'PYFIT'
          import json, math
          actual=json.load(open('/tmp/tail-damage-shapes.json'))
          recorded=json.load(open('assets/mig23mld/tail-damage-shapes.json'))
          assert actual.keys()==recorded.keys()
          for part, shape in actual['parts'].items():
              for key in ['pivot','half','neutralHalf']:
                  assert all(math.isclose(a,b,abs_tol=1e-10) for a,b in zip(shape[key],recorded['parts'][part][key]))
              assert shape['vertices']==recorded['parts'][part]['vertices']
          PYFIT
      - name: Rebuild source nozzle morph envelope
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror scripts/fit-mig23-nozzle-bounds.cpp -o /tmp/fit-mig23-nozzle
          /tmp/fit-mig23-nozzle docs/aircraft-review/mig23mld/nozzle-damage-vertices.csv > /tmp/nozzle-shape.json
          python3 - <<'PYNOZZLE'
          import json, math
          actual=json.load(open('/tmp/nozzle-shape.json'))
          recorded=json.load(open('assets/mig23mld/nozzle-damage-shape.json'))
          for key in ['pivot','half']:
              assert all(math.isclose(a,b,abs_tol=1e-10) for a,b in zip(actual[key],recorded[key]))
          assert actual['verticesPerPose']==recorded['verticesPerPose'] and actual['part']==recorded['part']==22
          PYNOZZLE
      - run: python3 scripts/update-web-manifest.py
      - run: python3 .deployment/restore.py
      - run: node --check scripts/native/build-mig23.mjs
      - run: node scripts/native/build-mig23.mjs
      - run: cp web/flight.wasm public/flight.wasm
      - run: node tests/mig23-native.mjs
      - run: node tests/mig23-autosweep.mjs
      - run: node tests/mig23-tail-combat.mjs public
      - run: node tests/mig23-nozzle-native.mjs public
      - run: node tests/mig23-nozzle-combat.mjs public
      - name: Legacy native flight/weapon/damage compatibility
        run: |
          node tests/mig15-native.mjs public
          node tests/mig29-native.mjs public
          node tests/su35-combat-native.mjs public
          node tests/missile-systems.mjs public
      - name: Web runtime and manifest integrity
        run: |
          node --check web/app.js
          node --check web/aircraft.js
          node --check web/mig23mld-game.js
          node --check web/mig23mld-flight.js
          node tests/mig23mld-preview.mjs public
          node tests/mig23mld-pbr.mjs public
          node tests/part-emitter-scale.mjs public
          node tests/wreckage-morph.mjs public
          node scripts/aircraft-progress.mjs
      - name: Real Chromium WebGL MiG-23MLD flight smoke
        run: |
          python3 -m venv /tmp/apex-playwright
          /tmp/apex-playwright/bin/pip install --quiet playwright==1.56.0
          # Ubuntu 24.04 runner supplies native libraries; launch/test still fails if any are missing.
          /tmp/apex-playwright/bin/python -m playwright install --only-shell chromium
          python3 -m http.server 8765 --directory public > /tmp/mig23-web.log 2>&1 &
          APEX_TEST_URL=http://127.0.0.1:8765 /tmp/apex-playwright/bin/python tests/missile-browser.py
          APEX_TEST_URL=http://127.0.0.1:8765 /tmp/apex-playwright/bin/python tests/mig23-browser.py
          APEX_TEST_URL=http://127.0.0.1:8765 /tmp/apex-playwright/bin/python tests/mig23-resource-browser.py
          APEX_TEST_URL=http://127.0.0.1:8765 /tmp/apex-playwright/bin/python tests/mig23-damage-browser.py
          APEX_TEST_URL=http://127.0.0.1:8765 /tmp/apex-playwright/bin/python tests/mig23-nozzle-browser.py
          APEX_TEST_URL=http://127.0.0.1:8765 /tmp/apex-playwright/bin/python tests/mig23-async-wreckage-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mig23-webgl-captures
          path: |
            /tmp/mig23-flight-browser
            /tmp/mig23-resource-browser
            /tmp/mig23-damage-browser
            /tmp/mig23-nozzle-browser
            /tmp/mig23-async-wreckage-browser
          if-no-files-found: ignore
