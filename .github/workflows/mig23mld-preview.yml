name: MiG-23MLD preview validation
on:
  push:
    branches: [opensource-mig23mld-20261105]
  pull_request:
    paths:
      - 'web/mig23mld*'
      - 'web/aircraft-tree*'
      - 'web/assets/mig23mld/**'
      - 'web/manifest.json'
      - 'tests/mig23mld-preview.mjs'
      - 'tests/mig23mld-studio-browser.py'
      - 'tests/mig23mld-pbr.mjs'
      - '.deployment/restore.py'
      - '.github/workflows/mig23mld-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify restored public web tree
        run: python3 .deployment/restore.py
      - name: Verify MiG-23MLD viewer and source geometry metadata
        run: |
          node tests/mig23mld-preview.mjs public
          node tests/mig23mld-pbr.mjs public
      - name: Verify real desktop and mobile 3D viewer in Chromium
        run: |
          python3 -m venv /tmp/apex-mig23-viewer
          /tmp/apex-mig23-viewer/bin/pip install --quiet playwright==1.56.0
          # Ubuntu 24.04 runner supplies native libraries; launch/test still fails if any are missing.
          /tmp/apex-mig23-viewer/bin/python -m playwright install --only-shell chromium
          python3 -m http.server 8766 --directory public >/tmp/mig23-studio-server.log 2>&1 &
          APEX_TEST_URL=http://127.0.0.1:8766 /tmp/apex-mig23-viewer/bin/python tests/mig23mld-studio-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mig23-studio-render-captures
          path: /tmp/mig23-studio-browser
          if-no-files-found: ignore
