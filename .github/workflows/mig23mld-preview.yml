name: MiG-23MLD preview validation
on:
  push:
    branches: [opensource-mig23mld-20261105]
  pull_request:
    paths:
      - 'web/mig23mld*'
      - 'web/aircraft-tree*'
      - 'web/assets/mig23mld/**'
      - 'web/manifest.json'
      - 'tests/mig23mld-preview.mjs'
      - '.deployment/restore.py'
      - '.github/workflows/mig23mld-preview.yml'
      - 'scripts/optimize-mig23-glb.py'
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify restored public web tree
        run: python3 .deployment/restore.py
      - name: Verify MiG-23MLD viewer and source geometry metadata
        run: node tests/mig23mld-preview.mjs public

  optimize:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf-mig23mld-fast-load-20261108'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf-mig23mld-fast-load-20261108
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-mig23-glb.py web/assets/mig23mld/Mig-23.glb
      - run: |
          python scripts/update-web-manifest.py
          python .deployment/restore.py
          node tests/mig23mld-preview.mjs public
      - name: Commit optimized model and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/assets/mig23mld/Mig-23.glb web/manifest.json
          git commit -m 'perf(mig23mld): optimize GLB textures and update manifest'
          git push origin HEAD:perf-mig23mld-fast-load-20261108
